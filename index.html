<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ログイン | シフト管理</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="login-wrap">
  <div class="card">
    <h2 style="margin-top:0;">個別指導塾 シフト管理</h2>
    <p class="hint">メールアドレスとパスワードでログインしてください。<br>アカウントをお持ちでない場合は管理者にお問い合わせください。</p>
    <div id="errorMsg" class="error-msg"></div>
    <form id="loginForm">
      <label>メールアドレス</label>
      <input type="email" id="email" required autocomplete="username" />
      <label>パスワード</label>
      <input type="password" id="password" required autocomplete="current-password" />
      <button type="submit" style="width:100%;">ログイン</button>
    </form>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/common.js"></script>
<script>
  // 既にログイン済みなら該当ページへ
  auth.onAuthStateChanged(async (user) => {
    if (user) {
      const snap = await db.collection("shift_users").doc(user.uid).get();
      if (snap.exists) {
        window.location.href = snap.data().role === "admin" ? "admin.html" : "staff.html";
      }
    }
  });

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const errorMsg = document.getElementById("errorMsg");
    errorMsg.textContent = "";
    try {
      await auth.signInWithEmailAndPassword(email, password);
      // onAuthStateChanged がリダイレクトを処理
    } catch (err) {
      errorMsg.textContent = "ログインに失敗しました: " + err.message;
    }
  });
</script>
</body>
</html>
