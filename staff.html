<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>アルバイト画面 | シフト管理</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="app-header">
  <h1>個別指導塾 シフト管理</h1>
  <div>
    <span class="user-badge" id="userBadge"></span>
    <button class="secondary small" onclick="logout()">ログアウト</button>
  </div>
</header>

<div class="container">
  <div class="tabs">
    <button class="tab-btn active" data-tab="availability">通常シフト希望入力</button>
    <button class="tab-btn" data-tab="sessionAvailability">講習会シフト希望入力</button>
    <button class="tab-btn" data-tab="confirmed">確定シフト</button>
  </div>

  <div class="tab-panel active" id="tab-availability">
    <div class="card">
      <p class="hint">セルをクリックすると 空欄 → ○(希望) → △(可能) の順で切り替わります。変更は自動的に保存されます。</p>
      <div class="legend">
        <span><span class="swatch" style="background:#fde68a;"></span>○ 希望</span>
        <span><span class="swatch" style="background:#bfdbfe;"></span>△ 可能</span>
      </div>
      <div id="availabilityGrid"></div>
      <div id="saveStatus" class="hint" style="margin-top:8px;"></div>
    </div>
  </div>

  <div class="tab-panel" id="tab-confirmed">
    <div class="card">
      <p class="hint">管理者が確定した、あなたの担当シフトです。</p>
      <div id="confirmedGrid"></div>
    </div>
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
        <h3 style="margin:0;">講習会の確定シフト</h3>
        <select id="confirmedSessionSelect" style="min-width:220px; margin-bottom:0;" onchange="loadConfirmedSessionShifts()"></select>
      </div>
      <div id="confirmedSessionGrid" class="table-scroll" style="margin-top:16px;">講習会を選択してください。</div>
    </div>
  </div>

  <div class="tab-panel" id="tab-sessionAvailability">
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
        <p class="hint" style="margin:0;">講習会（夏期講習・冬期講習など）期間中のシフト希望を、日付ごとに入力できます。セルをクリックすると 空欄 → ○(希望) → △(可能) の順で切り替わります。過去の日付はグレー表示になり入力できません。</p>
        <select id="sessionAvailabilitySelect" style="min-width:220px; margin-bottom:0;" onchange="onAvailabilitySessionChange()"></select>
      </div>
      <div class="legend" style="margin-top:12px;">
        <span><span class="swatch" style="background:#ffe0a3;"></span>○ 希望</span>
        <span><span class="swatch" style="background:#bcd6ff;"></span>△ 可能</span>
      </div>
      <div id="sessionAvailabilityGrid" class="table-scroll"></div>
      <div id="sessionSaveStatus" class="hint" style="margin-top:8px;"></div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/common.js"></script>
<script src="js/staff.js"></script>
</body>
</html>
